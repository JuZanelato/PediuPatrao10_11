<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produtos</title>
</head>
<body>

<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-boxes me-2 text-primary"></i>Produtos</h2>
        <button class="btn btn-primary" id="btnNovoProduto"
                th:if="${perfilLogado == 'ADMIN' or perfilLogado == 'GERENTE'}">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </button>
    </div>

    <div id="produtos-msg"></div>

    <div class="card card-body shadow-sm mb-3 d-none" id="cardProduto">
        <form id="produtoForm">
            <input type="hidden" id="produtoId">
            <div class="row g-2">
                <div class="col-md-4">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label for="tipo" class="form-label">Tipo</label>
                    <select id="tipo" class="form-select" required>
                        <option value="Pizza">Pizza</option>
                        <option value="Esfiha">Esfiha</option>
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Porção">Porção</option>
                        <option value="Adicional">Adicional</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="preco" class="form-label">Preço (R$)</label>
                    <input type="number" id="preco" class="form-control" step="0.01" min="0.01" required>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <div class="form-check mb-2">
                        <input type="checkbox" id="ativo" class="form-check-input" checked>
                        <label for="ativo" class="form-check-label">Ativo</label>
                    </div>
                </div>
                <div class="col-md-2 d-flex align-items-end gap-1">
                    <button type="submit" class="btn btn-success w-100">Salvar</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnFecharProduto">X</button>
                </div>
            </div>
        </form>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-3" th:if="${perfilLogado == 'ADMIN' or perfilLogado == 'GERENTE'}">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-4">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-3" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${produto.preco != null} ? ${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')} : '—'"></td>
                        <td th:text="${produto.ativo != null and !produto.ativo} ? 'Não' : 'Sim'"></td>
                        <td class="text-end pe-3" th:if="${perfilLogado == 'ADMIN' or perfilLogado == 'GERENTE'}">
                            <button class="btn btn-sm btn-outline-primary me-1" data-acao="editar"
                                    th:attr="data-id=${produto.id},data-nome=${produto.nome},data-tipo=${produto.tipo},data-preco=${produto.preco},data-ativo=${produto.ativo}">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </button>
                            <button class="btn btn-sm btn-outline-danger" data-acao="excluir" th:attr="data-id=${produto.id}">
                                <i class="bi bi-trash-fill"></i> Excluir
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
    (function () {
        const btnNovo = document.getElementById('btnNovoProduto');
        if (!btnNovo) return;
        const card = document.getElementById('cardProduto');
        const form = document.getElementById('produtoForm');

        function msg(texto, tipo) {
            document.getElementById('produtos-msg').innerHTML = `<div class="alert alert-${tipo}">${esc(texto)}</div>`;
        }

        btnNovo.addEventListener('click', () => {
            form.reset();
            document.getElementById('produtoId').value = '';
            card.classList.remove('d-none');
        });
        document.getElementById('btnFecharProduto').addEventListener('click', () => card.classList.add('d-none'));

        document.addEventListener('click', async (ev) => {
            const btn = ev.target.closest('[data-acao]');
            if (!btn || !btn.closest('table')) return;
            if (btn.dataset.acao === 'editar') {
                document.getElementById('produtoId').value = btn.dataset.id;
                document.getElementById('nome').value = btn.dataset.nome || '';
                document.getElementById('tipo').value = btn.dataset.tipo || 'Pizza';
                document.getElementById('preco').value = btn.dataset.preco || '';
                document.getElementById('ativo').checked = btn.dataset.ativo !== 'false';
                card.classList.remove('d-none');
            } else if (btn.dataset.acao === 'excluir') {
                if (!confirm('Excluir este produto?')) return;
                try {
                    await apiFetch('/api/produtos/' + encodeURIComponent(btn.dataset.id), { method: 'DELETE' });
                    location.reload();
                } catch (e) { msg(e.message, 'danger'); }
            }
        });

        form.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const id = document.getElementById('produtoId').value;
            const body = {
                nome: document.getElementById('nome').value,
                tipo: document.getElementById('tipo').value,
                preco: Number(document.getElementById('preco').value),
                ativo: document.getElementById('ativo').checked
            };
            try {
                await apiFetch(id ? '/api/produtos/' + encodeURIComponent(id) : '/api/produtos',
                               { method: id ? 'PUT' : 'POST', body });
                location.reload();
            } catch (e) { msg(e.message, 'danger'); }
        });
    })();
    </script>
</div>

</body>
</html>
