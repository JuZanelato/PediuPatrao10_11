# Configurações locais (ex.: MONGODB_URI) podem ficar em application-local.properties, que não vai para o Git
spring.config.import=optional:file:./application-local.properties
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:pizzaria_julianazanelato}
spring.data.mongodb.auto-index-creation=true

app.seguranca.senha-inicial=${SENHA_INICIAL:Pizza@2026}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

server.error.include-stacktrace=never
server.error.include-message=never

logging.level.com.umc.pediupatrao=INFO
